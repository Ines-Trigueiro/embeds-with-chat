[project]
name = "embeds"
version = "0.1.0"
description = "Chat-driven builder for sandboxed article embeds"
authors = [
    { name = "Ines-Trigueiro", email = "m.ines.trigueiro@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "types-openpyxl>=3.1.5.20261017",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = ["src", "tests"]
packages = ["embeds"]
